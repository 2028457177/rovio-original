# Alembic multi-DB migration config.
# env.py overrides sqlalchemy.url / version_table / version_locations
# at runtime based on -x target=<auth|user|chat|kb|admin>.
[alembic]
script_location = migrations
# placeholder url; env.py rewrites it per target
sqlalchemy.url = mysql+pymysql://root@localhost/lc_chat?charset=utf8mb4
# version_locations are relative to the project root (cwd); list all 5 target
# subdirs so ScriptDirectory can scan every baseline. env.py then restricts the
# active context to a single target via -x target=<name>.
version_path_separator = space
version_locations = migrations/versions/auth migrations/versions/user migrations/versions/chat migrations/versions/kb migrations/versions/admin

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
