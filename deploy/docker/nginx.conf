# ====== 容器化前端 Nginx 配置 ======
# upstream 指向 docker-compose 服务名 + 容器内端口
# 前端静态文件由 frontend 镜像 COPY 到 /usr/share/nginx/html

upstream auth_svc  { server auth_service:8001; }
upstream user_svc  { server user_service:8002; }
upstream chat_svc  { server chat_service:8003; }
upstream kb_svc    { server kb_service:8004; }
upstream admin_svc { server admin_service:8005; }
upstream file_svc  { server file_service:8006; }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ==================== auth_service (:8001) ====================
    location ~ ^/api/auth/ {
        proxy_pass http://auth_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location ~ ^/api/user/(password|security-question|devices) {
        proxy_pass http://auth_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }

    # ==================== user_service (:8002) ====================
    location ~ ^/api/user/(profile|avatar|schedule|model|account) {
        proxy_pass http://user_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/avatars/ {
        proxy_pass http://user_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/schedules/ {
        proxy_pass http://user_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }

    # ==================== chat_service (:8003) ====================
    location /api/chat {
        proxy_pass http://chat_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/conversations {
        proxy_pass http://chat_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/feedback {
        proxy_pass http://chat_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/tasks/ {
        proxy_pass http://chat_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/plans {
        proxy_pass http://chat_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }

    # ==================== kb_service (:8004) ====================
    location /api/admin/kb/ {
        proxy_pass http://kb_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/kb/ {
        proxy_pass http://kb_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }

    # ==================== admin_service (:8005) ====================
    location /api/admin/users {
        proxy_pass http://admin_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/admin/stats/ {
        proxy_pass http://admin_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }

    # ==================== file_service (:8006) ====================
    location /api/upload-word {
        proxy_pass http://file_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/download/ {
        proxy_pass http://file_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/file/ {
        proxy_pass http://file_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }

    # ==================== 健康检查 ====================
    location /api/health {
        proxy_pass http://auth_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
}
