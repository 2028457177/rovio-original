# Qdrant 向量库（长期记忆专用）
#
# 部署：docker compose up -d
# 数据卷：./storage 持久化向量数据
# 端口：6333（HTTP API）、6334（gRPC，本配置未启用）
#
# 与项目其他服务的关系：
# - chat_service 通过 AIRAGAgent/agent/memory/vector_store.py 连接本服务
# - 连接地址由 AIRAGAgent/config/memory.yml 的 qdrant_url 配置
# - 嵌入复用 chroma.yml 的 OpenAI 兼容嵌入（阿里云百炼 qwen3.7-text-embedding）

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: lc-course-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./storage:/qdrant/storage
      - ./config:/qdrant/config
    # 生产环境可加环境变量覆盖默认配置：
    # environment:
    #   - QDRANT__SERVICE__MAX_WORKERS=8
    #   - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q ok'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
