    # ==================== auth_service (:8001) ====================
    location ~ ^/api/auth/ {
        proxy_pass http://auth_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    # 密码 / 密保 / 登录设备 归 auth_service
    location ~ ^/api/user/(password|security-question|devices) {
        proxy_pass http://auth_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }

    # ==================== user_service (:8002) ====================
    location ~ ^/api/user/(profile|avatar|schedule|model|account) {
