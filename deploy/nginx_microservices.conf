# ====== 微服务版 Nginx 配置（支持 HTTPS）======
# 按路径前缀路由到 6 个微服务进程 + 前端静态文件
#
# 服务端口：
#   auth_service  :8001  认证 / 登录设备 / 密保
#   user_service  :8002  资料 / 头像 / 课表
#   chat_service  :8003  聊天 / 会话 / Agent
#   kb_service    :8004  知识库
#   admin_service :8005  管理员 / 数据看板
#   file_service  :8006  文件上传下载
#
# 证书：/etc/letsencrypt/live/www.rovio.online/
# 策略：域名访问强制 301 -> HTTPS；IP 直连保持 HTTP 服务可用

upstream auth_svc  { server 127.0.0.1:8001; }
upstream user_svc  { server 127.0.0.1:8002; }
upstream chat_svc  { server 127.0.0.1:8003; }
upstream kb_svc    { server 127.0.0.1:8004; }
upstream admin_svc { server 127.0.0.1:8005; }
upstream file_svc  { server 127.0.0.1:8006; }

# ==================== HTTP：域名强制跳转 HTTPS ====================
server {
    listen 80;
    server_name www.rovio.online;
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==================== HTTP：IP / 其他主机直连（无证书，保持完整服务）====================
server {
    listen 80 default_server;
    server_name _;

    # 前端静态文件根目录
    root /var/www/lc-course-frontend;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ==================== auth_service (:8001) ====================
    location ~ ^/api/auth/ {
        proxy_pass http://auth_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    # 密码 / 密保 / 登录设备 归 auth_service
    location ~ ^/api/user/(password|security-question|devices) {
        proxy_pass http://auth_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }

    # ==================== user_service (:8002) ====================
    # 资料 / 头像 / 课表 / 模型设置 / 注销 归 user_service
    location ~ ^/api/user/(profile|avatar|schedule|model|account) {
        proxy_pass http://user_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/avatars/ {
        proxy_pass http://user_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/schedules/ {
        proxy_pass http://user_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }

    # ==================== chat_service (:8003) ====================
    location /api/chat {
        proxy_pass http://chat_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/conversations {
        proxy_pass http://chat_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/feedback {
        proxy_pass http://chat_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/tasks/ {
        proxy_pass http://chat_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    # 计划历史（列表/详情）
    location /api/plans {
        proxy_pass http://chat_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }

    # ==================== kb_service (:8004) ====================
    location /api/admin/kb/ {
        proxy_pass http://kb_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/kb/ {
        proxy_pass http://kb_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }

    # ==================== admin_service (:8005) ====================
    location /api/admin/users {
        proxy_pass http://admin_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/admin/stats/ {
        proxy_pass http://admin_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }

    # ==================== file_service (:8006) ====================
    location /api/upload-word {
        proxy_pass http://file_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/download/ {
        proxy_pass http://file_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    # AI 工作区文件浏览（列目录 / 下载 / 预览）
    location /api/file/ {
        proxy_pass http://file_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }

    # ==================== 健康检查 ====================
    location /api/health {
        proxy_pass http://auth_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
}

# ==================== HTTPS ====================
server {
    listen 443 ssl;
    server_name www.rovio.online;

    ssl_certificate     /etc/letsencrypt/live/www.rovio.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.rovio.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS：强制浏览器在一段时间内只走 HTTPS（降低中间人降级风险）
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 前端静态文件根目录
    root /var/www/lc-course-frontend;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
