[project]
name = "Rovio"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "coloredlogs>=15.0.1",
    "chromadb>=1.0.0",
    "dashscope>=1.25.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langchain>=1.2.13",
    "langchain-chroma>=1.0.0",
    "langchain-community>=0.4.1",
    "langchain-deepseek>=1.0.1",
    "langchain-ollama>=0.1.0",
    "langchain-openai>=0.3.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.1.3",
    "langgraph-cli[inmem]>=0.4.24",
    "notebook>=7.5.5",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "PyJWT>=2.8.0",
    "pymysql>=1.1.0",
    "qdrant-client>=1.12.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "streamlit>=1.56.0",
    "uvicorn>=0.34.0",
    "openpyxl>=3.1.5",
    "playwright==1.61.0",
    "uiautomation>=2.0.29",
    "redis[hiredis]>=5.0.0",
    "pyautogui>=0.9.54",
    "pillow>=10.0.0",
    "paramiko>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
# langsmith 的 pytest 插件与当前 pydantic/typing_inspection 版本不兼容（schemas 导入报错），
# 测试体系默认禁用它；按服务目录单独运行（微服务天然隔离）：
#   pytest tests/auth_service/ -v
#   pytest tests/kb_service/   -v
addopts = "-p no:langsmith"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:jwt_auth",
    "ignore::jwt.warnings.InsecureKeyLengthWarning",
]

# 覆盖率：跑全部测试时加 --cov 即可，例：
#   pytest --cov --cov-report=term-missing --cov-report=html tests/
[tool.coverage.run]
branch = true
source = ["services", "AIRAGAgent"]
omit = [
    "*/tests/*",
    "services/*/start.bat",
    "services/*/start.sh",
    "services/migrate_to_microservices.py",
    "AIRAGAgent/**/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "except ImportError:",
    "if TYPE_CHECKING:",
]
